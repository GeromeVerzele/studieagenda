<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studie">
<meta name="theme-color" content="#F3F3F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studieagenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* VOICE: vrolijk en licht, zoals een moderne leerapp
   IDEA: een bento-dashboard van pastelkleurige tegels, en een agenda met kaartjes op een urenraster
   PICTURE: de datumtegel met je volgende blokken, en de urenring
   COLOUR and TYPE: wit en lichtgrijs, pastel per vak, zwart voor de hoofdactie; Inter
   LAYOUT: koptekst, tegels, lijst, zwevende pilnavigatie */
:root{color-scheme:light;
--bg:#F3F3F6;--card:#fff;--ink:#121216;--ink2:#71717A;--ink3:#A1A1AA;--line:#ECECF0;--chip:#F1F1F4;--dark:#121216;--onDark:#fff;
--lime:#DDF5BE;--limeInk:#2E5A12;--pink:#F6DDF4;--blue1:#CFE2FF;--blue2:#8DB8FF;--blueInk:#0B3B8C;--acc:#1F6BFF;--red:#F0443A;
--WSN:#FF8A3D;--WSNb:#FFEBDD;--DE:#C451D9;--DEb:#F6E1F8;--CDO:#2F6BFF;--CDOb:#DEE8FF;--WBT:#55B82E;--WBTb:#E4F7D2;--BS:#F2456B;--BSb:#FFE1E8;--WMS:#E0A800;--WMSb:#FFF3CC;
--sh:0 10px 30px rgba(20,20,40,.08);--ease:cubic-bezier(.32,.72,0,1)}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;height:52px;margin-bottom:8px}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFB27A,#F2456B);color:#fff;display:grid;place-items:center;font-weight:700}
.top h1{flex:1;margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:0}
.rb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.month{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
/* bento */
.bento{background:var(--card);border-radius:28px;padding:8px;display:grid;gap:8px;box-shadow:var(--sh)}
.tile{border-radius:22px;padding:16px;position:relative;overflow:hidden}
.date{background:var(--lime);display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:10px;min-height:150px}
.date .big{font-size:32px;line-height:1.05;font-weight:700;letter-spacing:-.03em;color:var(--limeInk)}
.date .wk{position:absolute;left:16px;bottom:14px;color:var(--limeInk);opacity:.7;font-size:14px}
.mini{display:flex;flex-direction:column;gap:6px}
.mc{background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:12px;padding:7px 10px 7px 12px;position:relative;text-align:left;width:100%}
.mc::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--cc,var(--ink3))}
.mc b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc span{font-size:12px;color:var(--ink2)}
.mc.fade{opacity:.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exam{background:var(--pink);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.exam .n{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.03em}
.exam small{color:var(--ink2);font-size:13px}.exam b{font-size:14px;font-weight:600;display:block;margin-top:2px}
.hrs{background:linear-gradient(160deg,var(--blue1),var(--blue2));color:var(--blueInk);min-height:150px;text-align:left}
.hrs{display:flex;flex-direction:column;justify-content:flex-start}.hrs .n{font-size:34px;line-height:1;font-weight:600;letter-spacing:-.02em}.hrs small{font-size:13px;opacity:.8;margin-top:4px}
.ringS{position:absolute;right:14px;bottom:14px;width:60px;height:60px}
.ringS svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringS .ic{position:absolute;inset:12px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--acc);box-shadow:0 4px 10px rgba(31,107,255,.3)}
.note{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:14px;box-shadow:var(--sh)}
.note i{width:28px;height:28px;flex:none;border-radius:50%;background:#FFE9D6;color:#E06A00;display:grid;place-items:center;font-style:normal;font-weight:700}
.note b{font-weight:600}.note span{color:var(--ink2)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 10px}
.sec h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.pillb{background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;display:flex;gap:4px;align-items:center}
/* vakkaarten */
.course{background:var(--card);border-radius:24px;padding:16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;box-shadow:var(--sh);text-align:left;width:100%}
.course h3{margin:0 0 4px;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.course .meta{font-size:13px;color:var(--ink2)}
.course .meta em{font-style:normal;color:var(--red);font-weight:600}
.gloss{width:84px;height:84px;border-radius:20px;background:linear-gradient(145deg,var(--cb),color-mix(in srgb,var(--cc) 45%,var(--cb)));display:grid;place-items:center;position:relative;overflow:hidden}
.gloss::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(255,255,255,0) 45%)}
.gloss svg{position:relative;z-index:1;color:var(--cc);width:46px;height:46px}
.seg{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:6px 6px 6px 8px}
.ticks{flex:1;display:flex;gap:2px;height:18px;align-items:stretch}
.ticks i{flex:1;border-radius:3px;background:color-mix(in srgb,var(--cc) 22%,var(--card))}
.ticks i.on{background:var(--cc)}
.seg span{font-size:12px;font-weight:600;white-space:nowrap;background:var(--card);border-radius:8px;padding:4px 8px}
/* agenda */
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin:0 -14px;padding-inline:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dp{flex:none;width:54px;height:76px;border-radius:999px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-snap-align:center;position:relative}
.dp b{font-size:19px;font-weight:700;line-height:1.1}.dp small{font-size:12px;color:var(--ink2)}
.dp.sel{background:var(--dark);color:var(--onDark)}.dp.sel small{color:inherit;opacity:.7}
.dp i{position:absolute;bottom:9px;width:5px;height:5px;border-radius:50%}.dp i.ex{background:var(--red)}.dp i.ok{background:var(--WBT)}.dp i.p{background:var(--ink3)}
.dp.today:not(.sel){box-shadow:inset 0 0 0 2px var(--acc)}
.grid{position:relative;background:var(--card);border-radius:28px;padding:12px 12px 12px 0;box-shadow:var(--sh)}
.hr{position:absolute;left:0;right:12px;display:flex;align-items:flex-start;gap:8px}
.hr span{width:52px;text-align:right;font-size:12px;color:var(--ink3);transform:translateY(-8px)}
.hr::after{content:"";flex:1;border-top:1px dashed var(--line)}
.ev{position:absolute;left:62px;right:12px;border-radius:16px;padding:8px 12px 8px 14px;text-align:left;overflow:hidden;background:linear-gradient(110deg,var(--cb),color-mix(in srgb,var(--cb) 30%,var(--card)));display:flex;gap:10px;align-items:flex-start;transition:transform .2s var(--ease)}
.ev:active{transform:scale(.98)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.ev .x{flex:1}.ev .tm{font-size:12px;color:var(--ink2)}.ev .tt{font-size:15px;font-weight:600;line-height:1.25;margin-top:1px}
.ev .st{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .go{width:34px;height:26px;border-radius:9px;background:var(--cc);color:#fff;display:grid;place-items:center;flex:none}
.ev.les{background:transparent;--cc:var(--ink3);right:auto;width:min(48%,200px);box-shadow:inset 0 0 0 1.5px var(--line)}.ev.les .tt{font-size:14px}.ev.les .tt{font-weight:500;color:var(--ink2)}
.ev.exam{background:var(--dark);color:var(--onDark);--cc:var(--red)}.ev.exam .tm,.ev.exam .st{color:inherit;opacity:.75}
.ev.done{opacity:.5}.ev.done .tt{text-decoration:line-through}
.ev.cmp{align-items:center;padding-block:4px}.ev.cmp .tm{display:none}.ev.cmp .st{display:none}.ev.cmp .tt{font-size:13px}
.ev.cur{box-shadow:0 0 0 2px var(--cc),var(--sh)}
.badge{display:inline-block;font-size:11px;font-weight:600;color:#C25A00;background:#FFE9D6;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.nowl{position:absolute;left:56px;right:12px;height:2px;background:var(--red);z-index:2}.nowl::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}
/* focus */
.fcard{border-radius:32px;padding:20px;background:linear-gradient(160deg,var(--cb),color-mix(in srgb,var(--cc) 35%,var(--cb)));box-shadow:var(--sh);text-align:center}
.fchip{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.ft{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:12px 0 2px}.fs{font-size:14px;color:var(--ink2)}
.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:18px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center}
.clock{font-size:clamp(44px,13vw,58px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.clock.over{color:var(--red)}.cl2{font-size:13px;color:var(--ink2);margin-top:6px}
.fb{display:flex;gap:8px}.btn{flex:1;height:52px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .2s var(--ease)}.btn:active{transform:scale(.97)}
.btn.blk{background:var(--dark);color:var(--onDark)}.btn.lt{background:color-mix(in srgb,var(--card) 80%,transparent)}.btn.ln{background:var(--chip)}
.link{display:block;margin:10px auto 0;color:var(--ink2);font-size:14px;min-height:44px}
.steps{background:var(--card);border-radius:24px;padding:6px 16px;box-shadow:var(--sh)}
.stp{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.stp:first-child{border-top:0}
.stp .bx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink3);display:grid;place-items:center;margin-top:-1px;transition:background .2s,border-color .2s}
.stp.on .bx{background:var(--cc,var(--acc));border-color:transparent;color:#fff}
.stp.on span{color:var(--ink3);text-decoration:line-through}
/* daglijst */
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);min-height:50px}.row:first-child{border-top:0}
.row .rt{width:42px;flex:none;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row i{width:4px;align-self:stretch;border-radius:2px;background:var(--cc,var(--ink3));flex:none}
.row .rx{flex:1}.row .rx b{display:block;font-size:15px;font-weight:600;line-height:1.3}.row .rx small{font-size:13px;color:var(--ink2)}
.row.les .rx{color:var(--ink2);font-size:14px}.row .rc{color:var(--ink3);flex:none}
.row.dn .rx b{text-decoration:line-through;color:var(--ink3)}.row.dn .rc{color:var(--WBT)}
.startc{background:var(--lime);color:var(--limeInk);border-radius:28px;padding:20px}.startc b{font-size:19px;font-weight:700;letter-spacing:-.01em}.startc p{margin:6px 0 16px;font-size:14px;line-height:1.45;opacity:.85}.startc .btn{width:100%;display:block}
.lock{margin-top:14vh}.lock input{width:100%;height:52px;border-radius:16px;border:0;padding:0 16px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}.lock .err{color:#B3261E;min-height:20px;margin:8px 2px 12px;opacity:1;font-weight:600}
/* voortgang */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:22px;padding:14px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between}
.stat b{font-size:30px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--ink2);line-height:1.3}
.s1{background:linear-gradient(160deg,var(--blue1),var(--blue2));color:var(--blueInk)}.s1 span{color:inherit;opacity:.8}.s2{background:var(--lime);color:var(--limeInk)}.s2 span{color:inherit;opacity:.8}.s3{background:var(--pink)}
.chart{background:var(--card);border-radius:28px;padding:16px;box-shadow:var(--sh)}
.chart .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:10px}.chart .hd b{color:var(--ink);font-size:15px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{width:100%;max-width:34px;border-radius:10px;background:var(--chip);min-height:8px;position:relative;overflow:hidden}
.bar i u{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--blue2),var(--acc));border-radius:10px}
.bar small{font-size:12px;color:var(--ink2)}.bar.t small{color:var(--ink);font-weight:700}
.foot{font-size:13px;color:var(--ink2);padding:4px 6px 0;line-height:1.45}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 10px 30px rgba(20,20,40,.14),inset 0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
.nb{width:68px;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink2);position:relative;transition:background .25s var(--ease),color .25s}.nb b{font-size:10px;line-height:12px;font-weight:600}.nb svg{width:21px;height:21px}
.nb[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(20,20,40,.12)}
.nb .dot{position:absolute;top:6px;right:19px;width:7px;height:7px;border-radius:50%;background:var(--red)}
/* sheet */
#sh .scrim{position:fixed;inset:0;background:rgba(10,10,20,.35);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:9}
#sh .sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:560px;margin:0 auto;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s var(--ease),visibility 0s .35s;max-height:88vh;overflow:auto}
#sh.open .scrim{opacity:1;pointer-events:auto}#sh.open .sheet{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink3);margin:0 auto 14px;opacity:.6}
.sh-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sh-h .gloss{width:56px;height:56px;border-radius:16px}.sh-h .gloss svg{width:30px;height:30px}
.sh-h h3{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em}.sh-h p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.sh-msg h3{margin:0 0 6px;font-size:20px;font-weight:700}.sh-msg p{margin:0 0 16px;color:var(--ink2);font-size:15px}
.mt{margin-top:12px}
.pop{animation:pop .35s var(--ease)}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){.date{grid-template-columns:1fr}.date .wk{position:static}}
</style>
</head>

  d.b.forEach(b=>{const t={id:b.id,c:b.c,w:b.w,p:b.p,d:d.d,s:b.s,e:b.e,min:mins(b.s,b.e)};TASKS.push(t);SLOTS.push({k:b.id,d:d.d,s:b.s,e:b.e,c:b.c,p:b.p})})});
// inhaalbuffer: zaterdagochtend in de lesweken, enkel gebruikt bij achterstand
['2026-11-21','2026-11-28','2026-12-05','2026-12-12'].forEach(d=>SLOTS.push({k:'buf-'+d,d,s:'10:00',e:'12:00',c:null,buf:true}));

let ASSIGN={},WHERE={},LATE=[],SHIFTED=0,MISSED=0;
function replan(){
  const now=Date.now();ASSIGN={};WHERE={};LATE=[];SHIFTED=0;MISSED=TASKS.filter(t=>!S.done[t.id]&&at(t.d,t.e)<=now).length;
  const live=s=>at(s.d,s.e)>now;
  const over=[];
  for(const c of ORDER){
    const q=TASKS.filter(t=>t.c===c&&!S.done[t.id]);
    const slots=SLOTS.filter(s=>s.c===c&&live(s));
    // taak die nu in de timer loopt blijft in zijn huidige slot
    q.forEach((t,i)=>{if(i<slots.length){ASSIGN[slots[i].k]=t.id;WHERE[t.id]=slots[i]}else over.push(t)});
  }
  over.sort((a,b)=>EXAM[a.c].d<EXAM[b.c].d?-1:1);
  const bufs=SLOTS.filter(s=>s.buf&&live(s));
  for(const t of over){const b=bufs.find(s=>!ASSIGN[s.k]&&s.d<EXAM[t.c].d);if(b){ASSIGN[b.k]=t.id;WHERE[t.id]=b}else LATE.push(t)}
  TASKS.forEach(t=>{const w=WHERE[t.id];if(w&&w.k!==t.id&&!S.done[t.id])SHIFTED++});
}

function lesRange(w){const m=w.match(/Les (\d+)(?:–(\d+))?/);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;const r=[];for(let i=a;i<=b;i++)r.push(i);return r}
function steps(t){
  const c=t.c,w=t.w,L=LES[c]||{},r=lesRange(w),title=n=>L[n]?`Les ${n}: ${L[n]}`:`Les ${n}`;
  if(c==='WMS'){
    if(/nawerken/i.test(w))return['Herlees de slides van de laatste les','Schrijf de nieuwe definities en formules op één blad','Maak 2 oefeningen van de vorige oefensessie opnieuw','Noteer wat je niet snapt voor de volgende oefensessie'];
    return['Overloop je samenvattingsblad met de formules','Maak de oefeningen zonder oplossing, in examenomstandigheden','Verbeter en noteer per fout in één zin wat er misliep','Herhaal de 3 types oefeningen die het vaakst fout gingen'];}
  if(/labo voorbereiden/i.test(w))return['Lees de opgave van het volgende labo volledig','Overloop de testvragen van het vorige labo','Schrijf op welke entity\'s en signalen je nodig hebt'];
  if(/opnieuw|herwerken|verbeteren/i.test(w)&&!/herhaling|herhalen/i.test(w)&&r)
    return r.map(n=>`${title(n)}: 2 oefeningen opnieuw, zonder oplossing`).concat(['Vergelijk met de oplossingen achteraan in de cursus','Schrijf per fout in één zin wat je verkeerd deed']);
  if(/examen|proefexamen|voorbeeldexamen|partieel/i.test(w)&&!/herhaling/i.test(w)){
    if(/verbeteren|herwerken|Fouten/i.test(w))return['Verbeter elke vraag met de oplossing','Noteer per fout de les waar ze bij hoort','Werk die les(sen) kort opnieuw door','Maak de foute vragen opnieuw zonder te kijken'];
    return['Leg alles weg behalve papier, rekenmachine en het formularium','Zet een timer op de duur van het echte examen','Maak het examen volledig, zonder op te zoeken','Verbeter daarna met de oplossingen'];}
  if(/overlopen/i.test(w))return['Overloop je samenvattingsblad met formules en stappenplannen','Lees de theorievragen nog één keer','Rustig eten, op tijd vertrekken naar de campus'];
  if(r&&/herhaling|herhalen|oefeningen/i.test(w)) return r.map(n=>`${title(n)}: formules uit het hoofd + 2 oefeningen`).concat(['Leg wat je nog niet kunt apart voor morgen']);
  if(r){ // eerste keer doorwerken
    const out=[];
    r.forEach(n=>{
      const tt=title(n);
      if(r.length>1){out.push(`${tt}: lees de les en het uitgewerkte voorbeeld`);out.push(`${tt}: maak alle oefeningen ${n}.x`);return}
      if(c==='WSN'||c==='D&E'||c==='BS')out.push('Bekijk de uitlegvideo bovenaan de les');
      out.push(`Lees ${tt}: intuïtie en formules`);
      if(c==='CDO')out.push('Teken elk schema uit de les zelf na op papier');
      out.push('Werk het uitgewerkte voorbeeld zelf uit, zonder te kijken');
      out.push(`Maak alle oefeningen ${n}.x op papier, zonder oplossing`);
      out.push('Verbeter met de oplossingen achteraan en herwerk je fouten');
      if(c==='D&E'&&[2,9,10,12,13].includes(n))out.push('Schrijf de theorievraag (afleiding) uit het hoofd op een blanco blad');
      if(c==='BS'&&n===7)out.push('Dit is de belangrijkste les: herhaal de oefeningen die fout liepen');
      if(c==='WBT')out.push('Maak de oefeningen van dit onderwerp uit reeks A op Toledo');
    });
    return out;}
  // vrije omschrijving (bv. theorievragen)
  return [w,'Verbeter met de oplossingen','Noteer wat je nog niet kunt'];
}

    const t=i.t,dn=!!S.done[t.id],mv=!dn&&i.slot.k!==t.id,st=steps(t),sub=S.sub[t.id]||[];
    g+=`<button class="ev${cmp}${dn?' done':''}${cur&&cur.id===t.id&&!dn?' cur':''}" style="${sty(t.c)};top:${top}px;height:${ht}px" data-a="open" data-id="${t.id}"><div class="x"><div class="tm">${i.s} – ${i.e}${i.slot.p?' · campus':''}${mv?'<span class="badge">verschoven</span>':''}</div><div class="tt">${esc(t.c)} · ${esc(t.w)}</div><div class="st">${esc(lt(t))} · ${dn?'klaar':sub.length+'/'+st.length+' stappen'}</div></div><span class="go">${dn?I.ok:I.play}</span></button>`});
  if(sel===today){const n=hm();if(n>=pad(lo)+':00'&&n<=pad(hi)+':00')g+=`<div class="nowl" style="top:${y(n)}px"></div>`}
  const body=items.length?`<div class="grid" style="height:${H}px">${g}</div>`:`<div class="grid"><div class="empty">${x&&x.n?esc(x.n):'Niets gepland'}</div></div>`;
  const shown=new Set(items.filter(i=>i.t&&i.t.id).map(i=>i.t.id)),extra=TASKS.filter(t=>S.done[t.id]&&!shown.has(t.id)&&(S.done[t.id].t||'').slice(0,10)===sel);
  return `<header class="top"><button class="rb" data-a="step" data-n="-1" aria-label="Vorige dag">${I.chv(-1)}</button><h1 style="text-align:center">${DL[z.getDay()]} ${z.getDate()} ${MN[z.getMonth()]}${x&&x.n?`<small>${esc(x.n)}</small>`:''}</h1><button class="rb" data-a="step" data-n="1" aria-label="Volgende dag">${I.chv(1)}</button></header>
  <div class="days" id="days">${pills}</div>${body}
  ${extra.length?`<div class="sec"><h2>Ook afgewerkt</h2></div><div class="steps">${extra.map(t=>`<button class="stp on" style="${sty(t.c)}" data-a="undo" data-id="${t.id}"><span class="bx">${I.ok}</span><span>${esc(t.c)} · ${esc(t.w)}</span></button>`).join('')}</div>`:''}
  ${sel!==today?`<button class="link" data-a="today" style="width:100%">Naar vandaag</button>`:''}`}

/* ---------- Focus ---------- */
function fmtClock(ms){const a=Math.abs(ms),h=Math.floor(a/36e5),m=Math.floor(a%36e5/6e4),s=Math.floor(a%6e4/1e3);return (ms<0?'+':'')+(h?h+':'+pad(m):m)+':'+pad(s)}
const elapsed=()=>T?T.acc+(T.start?Date.now()-T.start:0):0;
function planMs(t){const w=WHERE[t.id];return ((w?mins(w.s,w.e):t.min)+(T&&T.id===t.id?(T.extra||0):0))*6e4}
function stepList(t){const st=steps(t),sub=S.sub[t.id]||[],dn=!!S.done[t.id];return `<div class="steps" style="${sty(t.c)}">${st.map((x,i)=>{const on=dn||sub.includes(i);return `<button class="stp${on?' on':''}" data-a="sub" data-id="${t.id}" data-i="${i}" role="checkbox" aria-checked="${on}"><span class="bx">${on?I.ok:''}</span><span>${esc(x)}</span></button>`}).join('')}</div>`}
function focus(){
  const t=focusTask();
  if(!t)return `<header class="top"><h1>Focus</h1></header><div class="empty">Alles is afgewerkt.</div>`;
  const w=WHERE[t.id],el=T&&T.id===t.id?elapsed():0,pl=planMs(t),rem=pl-el,fr=Math.min(1,el/pl),C=2*Math.PI*52;
  const run=T&&T.id===t.id&&T.start,started=T&&T.id===t.id;
  return `<header class="top"><h1>Focus<small>${w?(w.d===today?'Vandaag':dlabel(w.d))+' · '+w.s+' – '+w.e:''}</small></h1></header>
  <section class="fcard" style="${sty(t.c)}"><span class="fchip"><i></i>${esc(NAMES[t.c])}</span><div class="ft">${esc(t.w)}</div><div class="fs">${esc(lt(t))}</div>
   <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="color-mix(in srgb,var(--card) 70%,transparent)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--cc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-fr)}"/></svg><div class="in"><div class="clock${rem<0?' over':''}" id="clock" role="timer">${fmtClock(rem)}</div><div class="cl2">${run?'bezig':started?'gepauzeerd':'klaar om te starten'}</div></div></div>
   <div class="fb"><button class="btn blk" data-a="toggle" data-id="${t.id}">${run?'Pauzeer':started?'Hervat':'Start'}</button><button class="btn lt" data-a="done" data-id="${t.id}">Klaar</button></div>
   ${started?'<button class="link" data-a="reset">Timer resetten</button>':''}</section>
  <div class="sec"><h2>Wat je doet</h2></div>${stepList(t)}`}

/* ---------- Voortgang ---------- */
function streak(){const days=new Set(Object.values(S.done).map(v=>v.t&&v.t.slice(0,10)).filter(Boolean));let n=0,d=today;if(!days.has(d))d=addD(d,-1);while(days.has(d)){n++;d=addD(d,-1)}return n}
function vg(){
  const mon=addD(today,-((pd(today).getDay()+6)%7)),per=[];for(let i=0;i<7;i++)per.push(minsOn(addD(mon,i)));
  const mx=Math.max(120,...per),wk=per.reduce((a,b)=>a+b,0),tot=TASKS.filter(t=>S.done[t.id]).length;
  const ft=focusTask(),fw=ft&&WHERE[ft.id];
  const firstC=`<div class="tile startc"><b>Nog niets afgevinkt</b><p>${ft?`Je eerste blok is ${esc(ft.c)} · ${esc(ft.w)}${fw?`, ${fw.d===today?'vandaag':dlabel(fw.d)} om ${fw.s}`:''}. `:''}Zodra je een blok afvinkt, zie je hier je uren en je reeks.</p>${ft?`<button class="btn blk" data-a="focusgo" data-id="${ft.id}">Start eerste blok</button>`:''}</div>`;
  return `<header class="top"><h1>Voortgang<small>Week van ${short(mon)}</small></h1></header>
  ${tot?`<div class="stats"><div class="stat s1"><b>${fmtH(wk)}</b><span>uur deze week</span></div><div class="stat s2"><b>${streak()}</b><span>dagen op rij</span></div><div class="stat s3"><b>${tot}</b><span>van ${TASKS.length} blokken af</span></div></div>
  <div class="sec"><h2>Per dag</h2></div>
  <div class="chart"><div class="bars">${per.map((m,i)=>{const d=addD(mon,i);return `<div class="bar${d===today?' t':''}"><i style="height:100%" title="${m} min"><u style="height:${m/mx*100}%"></u></i><small>${DN[pd(d).getDay()]}</small></div>`}).join('')}</div></div>`:firstC}
  <div class="sec"><h2>Per vak</h2></div>${ORDER.map(courseCard).join('')}
  <p class="foot">Werk je een blok niet af, dan schuift het naar het volgende blok van hetzelfde vak. Past het niet meer vóór het examen, dan komt het in een inhaalbuffer op zaterdag 10:00–12:00.</p>`}

/* ---------- render ---------- */
function render(){
  replan();
  const body={home,agenda,focus,vg}[tab]();
  const run=T&&T.start;
  document.getElementById('root').innerHTML=`<main class="wrap">${body}</main>
  <nav class="nav" role="tablist" aria-label="Navigatie">
   <button class="nb" role="tab" aria-label="Home" aria-selected="${tab==='home'}" data-a="tab" data-v="home">${I.home}<b>Home</b></button>
   <button class="nb" role="tab" aria-label="Agenda" aria-selected="${tab==='agenda'}" data-a="tab" data-v="agenda">${I.cal}<b>Agenda</b></button>
   <button class="nb" role="tab" aria-label="Focus" aria-selected="${tab==='focus'}" data-a="tab" data-v="focus">${I.tim}${run&&tab!=='focus'?'<span class="dot"></span>':''}<b>Focus</b></button>
   <button class="nb" role="tab" aria-label="Voortgang" aria-selected="${tab==='vg'}" data-a="tab" data-v="vg">${I.bar}<b>Voortgang</b></button></nav>
  <div id="sh"><div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="shB"></div></div></div>`;
  if(tab==='agenda'){const p=document.getElementById('dp-'+sel);if(p)p.scrollIntoView({inline:'center',block:'nearest'})}
  if(sheetId)openBlock(sheetId,true)}

function openBlock(id,keep){const t=TASK[id],w=WHERE[id],dn=!!S.done[id];sheetId=id;
  document.getElementById('shB').innerHTML=`<div class="sh-h" style="${sty(t.c)}"><div class="gloss">${VI[t.c]}</div><div><h3>${esc(t.w)} · ${esc(lt(t))}</h3><p>${w?(w.d===today?'Vandaag':dlabel(w.d))+' · '+w.s+' – '+w.e:dn?'Afgewerkt':''}${w&&w.k!==id&&!dn?' · verschoven':''}</p></div></div>${stepList(t)}
  <div class="fb mt">${dn?`<button class="btn ln" data-a="undo" data-id="${id}">Toch niet klaar</button>`:`<button class="btn blk" data-a="focusgo" data-id="${id}">Start focus</button><button class="btn ln" data-a="done" data-id="${id}">Klaar</button>`}</div>`;
  const sh=document.getElementById('sh'),sp=sh.querySelector('.sheet');if(keep){sp.style.transition='none';sh.className='open';requestAnimationFrame(()=>requestAnimationFrame(()=>sp.style.transition=''))}else sh.className='open'}
function msg(h,p){sheetId=null;document.getElementById('shB').innerHTML=`<div class="sh-msg"><h3>${esc(h)}</h3><p>${esc(p)}</p></div><button class="btn blk" style="width:100%" data-a="close">Oké</button>`;document.getElementById('sh').className='open'}
function closeSheet(){sheetId=null;const s=document.getElementById('sh');if(s)s.className=''}

function tick(){
  if(tab!=='focus'||!T||!T.start)return;const t=TASK[T.id];if(!t)return;
  const el=elapsed(),pl=planMs(t),rem=pl-el,C=2*Math.PI*52,c=document.getElementById('clock'),a=document.getElementById('arc');
  if(c){c.textContent=fmtClock(rem);c.classList.toggle('over',rem<0)}if(a)a.setAttribute('stroke-dashoffset',C*(1-Math.min(1,el/pl)));
  if(rem<=0&&!T.beeped){T.beeped=true;saveT();beep();sheetId=null;document.getElementById('shB').innerHTML=`<div class="sh-msg"><h3>Tijd is om</h3><p>${esc(t.c)} · ${esc(t.w)}. Klaar, of heb je nog even nodig?</p></div><div class="fb"><button class="btn blk" data-a="done" data-id="${t.id}">Klaar</button><button class="btn ln" data-a="extend">Nog 15 min</button></div>`;document.getElementById('sh').className='open'}}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.25);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}
function markDone(id){const t=TASK[id],m=T&&T.id===id?Math.max(1,Math.round(elapsed()/6e4)):(WHERE[id]?mins(WHERE[id].s,WHERE[id].e):t.min);
  S.done[id]={m,t:iso(Date.now())+'T'+hm()};if(T&&T.id===id){T=null;saveT()}save();sheetId=null;render();
  const n=focusTask();msg('Blok afgewerkt',`${t.c} · ${t.w}: ${m} minuten.${n?` Volgende: ${n.c} · ${n.w}${WHERE[n.id]?` (${WHERE[n.id].d===today?'vandaag':short(WHERE[n.id].d)} ${WHERE[n.id].s})`:''}.`:''}`)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(a==='tab'){tab=el.dataset.v;sheetId=null;scrollTo(0,0)}
  else if(a==='day')sel=el.dataset.d;
  else if(a==='step'){const n=addD(sel,+el.dataset.n);sel=n<first?first:n>last?last:n}
  else if(a==='today')sel=today<first?first:today;
  else if(a==='open'){openBlock(id);return}
  else if(a==='vak'){tab='agenda';const c=el.dataset.c,t=TASKS.find(t=>t.c===c&&!S.done[t.id]&&WHERE[t.id]);if(t)sel=WHERE[t.id].d;scrollTo(0,0)}
  else if(a==='sub'){const i=+el.dataset.i,arr=S.sub[id]||(S.sub[id]=[]),k=arr.indexOf(i);k<0?arr.push(i):arr.splice(k,1);save();
    if(!S.done[id]&&arr.length>=steps(TASK[id]).length){markDone(id);return}}
  else if(a==='done'){markDone(id);return}
  else if(a==='undo'){delete S.done[id];save()}
  else if(a==='focusgo'){if(!T||T.id!==id){T={id,acc:0,start:null};saveT()}tab='focus';sheetId=null;scrollTo(0,0)}
  else if(a==='toggle'){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(_){}
    if(!T||T.id!==id)T={id,acc:0,start:Date.now()};else if(T.start){T.acc+=Date.now()-T.start;T.start=null}else T.start=Date.now();saveT()}
  else if(a==='reset'){T=null;saveT()}
  else if(a==='extend'){if(T){T.extra=(T.extra||0)+15;T.beeped=false;saveT()}closeSheet();return}
  else if(a==='close'){closeSheet();return}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){today=iso(Date.now());render()}});
let lastMin=hm();
setInterval(()=>{const t=iso(Date.now()),m=hm(),open=document.getElementById('sh').className;if(t!==today){today=t;if(!open)render()}else if(m!==lastMin&&tab!=='focus'&&!open){lastMin=m;render()}tick()},1000);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
}
{
const E=JSON.parse(document.getElementById('plan').textContent),b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dec=async raw=>{const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},k,b(E.c));return JSON.parse(new TextDecoder().decode(p))};
const derive=async pw=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(E.s),iterations:E.n},m,256))};
const lock=err=>{document.getElementById('root').innerHTML=`<main class="wrap"><form class="lock" id="lf"><div class="tile startc"><b>Studieagenda</b><p>Deze planning is versleuteld. Geef je wachtwoord één keer in; daarna onthoudt dit toestel het.</p><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Wachtwoord" placeholder="Wachtwoord"><p class="err" role="alert">${err||''}</p><button class="btn blk">Ontgrendel</button></div></form></main>`;
  document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value.toLowerCase().replace(/[\s-]/g,'');try{const raw=await derive(pw),d=await dec(raw);try{localStorage.setItem('sa-key',btoa(String.fromCharCode(...raw)))}catch(_){}boot(d.plan,d.name)}catch(_){lock('Dat wachtwoord klopt niet.')}})};
(async()=>{let k=null;try{k=localStorage.getItem('sa-key')}catch(_){}if(k){try{const d=await dec(b(k));boot(d.plan,d.name);return}catch(_){}}lock()})();
}
</script>
</body>
</html>
